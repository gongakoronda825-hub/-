<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#87ceeb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ブロックの世界</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">

<body>
  <canvas id="scene"></canvas>

  <!-- 入力ゾーン。左半分＝移動、右半分＝視点。ボタンはこれらの兄弟にして、
       押しても視点操作に取られないようにしている。 -->
  <div id="joystick-zone"></div>
  <div id="look-zone"></div>

  <button type="button" id="break-button" class="action">こわす</button>
  <button type="button" id="place-button" class="action">おく</button>

  <!-- 照準・デバッグ表示・操作説明はここに差し込まれる -->
  <div id="ui"></div>

  <!-- 縦持ちのときだけ出る案内（CSS のみ） -->
  <div id="rotate-hint"><p>横向きにしてください</p></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
